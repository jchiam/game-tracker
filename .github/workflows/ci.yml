name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenSpec specs and changes
        run: npx openspec validate --all --json

      - name: Check no active OpenSpec changes have incomplete tasks
        shell: bash
        run: |
          FAILED=0
          for change_dir in openspec/changes/*/; do
            name=$(basename "$change_dir")
            [ "$name" = "archive" ] && continue
            tasks_file="${change_dir}tasks.md"
            [ -f "$tasks_file" ] || continue
            if grep -qF "- [ ]" "$tasks_file"; then
              count=$(grep -cF "- [ ]" "$tasks_file")
              echo "::error::Active change '$name' has $count incomplete task(s) — archive or complete before merging"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Check formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      # Repository secret or variable VITE_SUPABASE_URL (prod Supabase API URL). Both unset → verify skips.
      - name: Verify CSP connect-src matches Supabase URL
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run verify:csp

      - name: Run unit tests
        run: npm test

      - name: Verify production build
        run: npm run build
        env:
          VITE_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/dummy

      # Gates shipped dependencies only. braces (GHSA-vfj7-8cjw-p6xm) has no patched
      # release and reaches us only through the dev-only openspec CLI — revert to a
      # plain `npm audit` gate once braces ships a fix.
      - name: Security audit
        run: npm audit --omit=dev

      - name: Security audit (dev dependencies, non-blocking)
        run: npm audit
        continue-on-error: true

  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: build_and_test
    # Browsers + system deps come preinstalled in the official Playwright image,
    # replacing `npx playwright install --with-deps` (3 browser downloads + apt
    # every run). The image tag MUST match the installed @playwright/test
    # version — the assert step below fails loudly when a dependency bump
    # moves one without the other.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Assert Playwright image matches @playwright/test
        shell: bash
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.62.1" ]; then
            echo "::error::@playwright/test is $installed but the e2e container image is v1.62.1 — bump the image tag in ci.yml"
            exit 1
          fi
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # Actions overrides HOME to /github/home inside containers; the
          # image's browsers live under /root/.cache/ms-playwright.
          HOME: /root
          VITE_HOST: 127.0.0.1
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: dummy_key
          VITE_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/dummy
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
