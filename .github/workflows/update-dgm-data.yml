name: Update Digimon devices

# Manual dispatch only — the device catalog is generated from a hand-authored
# seed (scripts/seeds/dgm-devices.json), so there is no upstream to poll.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run update script
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        run: node scripts/update-dgm-data.mjs

      - name: Format generated files
        run: npm run format

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-dgm-data-$(date -u +%Y%m%d)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(dgm): regenerate device catalog"
          git push --no-verify origin "$BRANCH"
          gh pr create \
            --title "chore(dgm): regenerate device catalog" \
            --body "Regenerated the Digimon device catalog and image assets from the hand-authored seed (scripts/seeds/dgm-devices.json)." \
            --base main \
            --head "$BRANCH"
